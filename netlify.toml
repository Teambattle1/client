[build]
  command = "npm run build"
  publish = "dist"

# Enkeltside-app: alle stier skal ramme index.html, ellers giver et direkte
# kundelink (/p/482913) en 404 hos Netlify i stedet for at åbne portalen.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
